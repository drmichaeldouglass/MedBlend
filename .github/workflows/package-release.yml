name: Package MedBlend Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.0"
  BLENDER_DIR: ${{ runner.temp }}/blender-5.2.0-linux-x64

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BASE_URL="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ARCHIVE" "$BASE_URL/$ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/blender.sha256" "$BASE_URL/blender-${BLENDER_VERSION}.sha256"
          (
            cd "$RUNNER_TEMP"
            grep " $ARCHIVE$" blender.sha256 | sha256sum --check
            tar -xJf "$ARCHIVE"
          )

      - name: Validate extension source
        run: |
          "$BLENDER_DIR/blender" --command extension validate .

      - name: Build extension
        run: |
          mkdir -p dist
          "$BLENDER_DIR/blender" --command extension build --source-dir . --output-dir dist

      - name: Validate built archive
        run: |
          shopt -s nullglob
          packages=(dist/*.zip)
          test "${#packages[@]}" -eq 1
          "$BLENDER_DIR/blender" --command extension validate "${packages[0]}"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
