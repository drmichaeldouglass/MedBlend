name: Package MedBlend Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.0"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Every path below is derived from BLENDER_VERSION, so bumping the one
      # variable at the top of the file moves the download, the cache and the
      # binary together.
      - name: Resolve Blender paths
        run: |
          echo "BLENDER_DIR=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_ENV"
          echo "BLENDER=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          ARCHIVE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          # Releases are grouped by major.minor: 5.2.0 lives under Blender5.2.
          BASE_URL="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ARCHIVE" "$BASE_URL/$ARCHIVE"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/blender.sha256" "$BASE_URL/blender-${BLENDER_VERSION}.sha256"
          (
            cd "$RUNNER_TEMP"
            grep " $ARCHIVE$" blender.sha256 | sha256sum --check
            tar -xJf "$ARCHIVE"
          )

      # A cache entry saved from a failed run can be missing the binary, which
      # would otherwise surface as a confusing error several steps later.
      - name: Check Blender runs
        run: |
          test -x "$BLENDER"
          "$BLENDER" --version

      - name: Validate extension source
        run: |
          "$BLENDER" --command extension validate .

      - name: Build extension
        run: |
          mkdir -p dist
          "$BLENDER" --command extension build --source-dir . --output-dir dist

      - name: Validate built archive
        run: |
          shopt -s nullglob
          packages=(dist/*.zip)
          test "${#packages[@]}" -eq 1
          "$BLENDER" --command extension validate "${packages[0]}"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
